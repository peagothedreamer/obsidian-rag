[project]
name = "obsidian-rag"
version = "0.1.0"
description = "Local Obsidian notes RAG with measurable retrieval quality"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "numpy>=2.0",
    "openai>=1.40",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning:jieba"]